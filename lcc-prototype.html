      case "category_threshold_clear": { const e = categoryThresholds.find((x) => x.categoryId === c.targetId); if (e) { ["cogsMin", "cogsMax", "unitsMin", "unitsMax", "weightMin", "weightMax"].forEach((k) => e[k] = null); } break; }
      case "brand_threshold": { let e = brandThresholds.find((x) => x.brandId === c.targetId); if (!e) { const b = brands.find((x) => x.id === c.targetId); e = { brandId: c.targetId, brandName: p.brandName || b?.name, categoryId: b?.categoryId, categoryName: "", cogsMin: null, cogsMax: null, unitsMin: null, unitsMax: null, weightMin: null, weightMax: null, isActive: true }; brandThresholds.push(e); } e[p.field] = p.value; break; }
      case "brand_threshold_clear": { const e = brandThresholds.find((x) => x.brandId === c.targetId); if (e) ["cogsMin", "cogsMax", "unitsMin", "unitsMax", "weightMin", "weightMax"].forEach((k) => e[k] = null); break; }
      case "global_product_config": productConfig[p.field] = p.value; break;
      case "brand_shelf_life": { const b = brands.find((x) => x.id === (p.brandId ?? c.targetId)); if (b) { b.shelfLifeOverridePct = p.shelfLifeOverridePct ?? null; b.isActive = p.isActive ?? false; } break; }
      case "sku_config": { const s = skus.find((x) => x.id === c.targetId); if (s) { s.shelfLifeOverridePct = p.shelfLifeOverridePct ?? null; s.isIgnored = p.isIgnored ?? false; } break; }
      case "inventory_condition": { const cc = inventoryConditions.find((x) => x.conditionType === c.targetId); if (cc) cc.isEnabled = p.enabled; break; }
    }
  }
  function doCommit() {
    const now = new Date().toISOString();
    const applied = S.pending.length;
    S.pending.forEach((c) => {
      const before = {};
      applyPending(c);
      S.auditLogs.unshift({ id: nextAuditId(), eventDt: now, module: AUDIT_MODULE[c.entity] ?? c.module, action: commitActionName(c), entity: c.entity, entityId: c.targetId, summary: pendingSummary(c), userId: "prototype_user", sessionId: "prototype-session", beforeJson: JSON.stringify(before), afterJson: JSON.stringify(c.payload) });
    });
    S.auditLogs.unshift({ id: nextAuditId(), eventDt: now, module: "draft", action: "configuration_committed", entity: "draft", entityId: null, summary: `${applied} change${applied !== 1 ? "s" : ""} committed`, userId: "prototype_user", sessionId: "prototype-session", beforeJson: JSON.stringify({ pendingCount: applied }), afterJson: JSON.stringify({ pendingCount: 0 }) });
    S.pending = [];
    S.commitApplied = applied;
    S.commitResult = true;
  }

  function exportCSV() {
    const logs = S.auditLogs;
    const headers = ["ID", "Event DT", "Module", "Action", "Entity", "Entity ID", "Summary", "User ID"];
    const rows = logs.map((l) => [l.id, l.eventDt, l.module, l.action, l.entity, l.entityId ?? "", `"${l.summary.replace(/"/g, '""')}"`, l.userId]);
    const csv = [headers.join(","), ...rows.map((r) => r.join(","))].join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `audit-log-${new Date().toISOString().slice(0, 10)}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

  /* ═══════════════════════ RENDER ═══════════════════════ */
  function render() {
    document.documentElement.classList.toggle("light", S.theme === "light");
    let page;
    if (S.route === "warehouse") page = pageWarehouse();
    else if (S.route === "product") page = pageProduct();
    else if (S.route === "thresholds") page = pageThresholds();
    else if (S.route === "approval") page = pageApproval();
    else page = pageAudit();
    document.getElementById("root").innerHTML =
      renderSidebar() +
      `<main class="flex-1 min-h-screen transition-[margin] duration-200 ${S.collapsed ? "ml-14" : "ml-60"}">${page}</main>` +
      renderModals();
    afterRender();
  }
  function afterRender() {
    if (S.editKey) { const i = document.querySelector("[data-inline-input]"); if (i) { i.focus(); try { i.select(); } catch (e) {} } return; }
    if (S._focus) {
      let el = S._focus.sel === "__selsearch" ? document.querySelector("[data-sel-search]") : document.querySelector(`[data-input="${S._focus.sel}"]`);
      if (el) { el.focus(); try { el.setSelectionRange(S._focus.caret, S._focus.caret); } catch (e) {} }
    }
  }

  /* ═══════════════════════ INLINE EDIT ═══════════════════════ */
  function commitInline(action, raw) {
    const t = String(raw).trim();
    const value = t === "" ? null : (isNaN(parseFloat(t)) ? null : parseFloat(t));
    const parts = action.split(":");
    const kind = parts[0];
    if (kind === "gthresh") stageChange("transfer_thresholds", "global_threshold", "set", null, { field: parts[1], value });
    else if (kind === "cthresh") { const cat = categories.find((c) => c.id === parts[1]); stageChange("transfer_thresholds", "category_threshold", "set", parts[1], { categoryId: parts[1], categoryName: cat?.name, field: parts[2], value }); }
    else if (kind === "bthresh") { const b = brands.find((x) => x.id === parts[1]); stageChange("transfer_thresholds", "brand_threshold", "set", parts[1], { brandId: parts[1], brandName: b?.name, field: parts[2], value }); }
    else if (kind === "prod-global") stageChange("product_config", "global_product_config", "set", null, { field: parts[1], value });
    else if (kind === "prod-brand-sl") { const b = brands.find((x) => x.id === parts[1]); const eb = effBrand(b); stageChange("product_config", "brand_shelf_life", "set", parts[1], { brandId: parts[1], brandName: b.name, categoryId: b.categoryId, shelfLifeOverridePct: value, isActive: true }); }
    else if (kind === "prod-sku-sl") { const s = skus.find((x) => x.id === parts[1]); const es = effSku(s); stageChange("product_config", "sku_config", "set", parts[1], { shelfLifeOverridePct: value, isIgnored: es.isIgnored }); }
    S.editKey = null; S.editDraft = null;
    render();
  }

  /* ═══════════════════════ TOGGLES ═══════════════════════ */
  function handleToggle(action) {
    const [kind, id] = action.split(":");
    if (kind === "donor") { const part = effDonorParticipating(id); stageChange("warehouse_setup", "donor_participation", "set", id, { isParticipating: !part }); }
    else if (kind === "route-off") stageChange("warehouse_setup", "pair_override", "clear", id, {});
    else if (kind === "prod-global-bool") { const cfg = effProductConfig(); stageChange("product_config", "global_product_config", "set", null, { field: id, value: !cfg[id] }); }
    else if (kind === "prod-brand-active") { const b = brands.find((x) => x.id === id); const eb = effBrand(b); stageChange("product_config", "brand_shelf_life", "set", id, { brandId: id, brandName: b.name, categoryId: b.categoryId, shelfLifeOverridePct: eb.shelfLifeOverridePct, isActive: !eb.isActive }); }
    else if (kind === "prod-sku-elig") { const s = skus.find((x) => x.id === id); const es = effSku(s); stageChange("product_config", "sku_config", "set", id, { shelfLifeOverridePct: es.shelfLifeOverridePct, isIgnored: !es.isIgnored }); }
    else if (kind === "prod-cond") { const cc = inventoryConditions.find((x) => x.conditionType === id); const ec = effCondition(cc); stageChange("product_config", "inventory_condition", "set", id, { enabled: !ec.isEnabled }); }
    render();
  }

  /* ═══════════════════════ SEARCHABLE SELECT PICK ═══════════════════════ */
  function handleSelectPick(action, val) {
    if (action === "wh-add-donor") { S.whAddDonor = val; S.whAddSink = ""; }
    else if (action === "wh-add-sink") S.whAddSink = val;
    else if (action.startsWith("route-edit:")) { const donorId = action.split(":")[1]; stageChange("warehouse_setup", "pair_override", "set", donorId, { sinkId: val }); S.whEditRoute = null; }
    else if (action === "th-cat-add-pick") S.thCatAdd = val;
    else if (action === "th-brand-add-pick") S.thBrandAdd = val;
    else if (action === "pr-brand-add-pick") S.prBrandAdd = val;
    else if (action === "pr-sku-add-pick") S.prSkuAdd = val;
    S.openSel = null; S.selQ = "";
    render();
  }

  /* ═══════════════════════ ACTIONS ═══════════════════════ */
  const SET_STATE = { whDonorFilter: 1, prSkuElig: 1, prSkuType: 1, txnStatus: 1, auAction: 1, apTab: 1, auTab: 1 };
  function handleAction(act, el) {
    // simple state setters
    if (SET_STATE[act]) { S[act] = el.getAttribute("data-val"); if (act === "auTab" || act === "apTab") S.auExpanded = S.auExpanded; render(); return; }
    const id = el.getAttribute("data-id");
    switch (act) {
      case "collapse": S.collapsed = !S.collapsed; break;
      case "theme": S.theme = S.theme === "dark" ? "light" : "dark"; break;
      case "open-draft": S.draftModalOpen = true; break;
      case "close-draft": S.draftModalOpen = false; break;
      case "open-commit": S.commitModalOpen = true; S.commitResult = false; break;
      case "close-commit": S.commitModalOpen = false; break;
      case "commit-go": doCommit(); break;
      case "commit-done": S.commitModalOpen = false; S.commitResult = false; break;
      case "discard-ask": S.discardConfirm = true; break;
      case "discard-cancel": S.discardConfirm = false; break;
      case "discard-now": S.pending = []; S.discardConfirm = false; break;
      case "set-sink": stageChange("warehouse_setup", "master_sink", "set", id, { warehouseId: id }); break;
      case "wh-toggle-add": S.whShowAdd = !S.whShowAdd; S.whAddDonor = ""; S.whAddSink = ""; break;
      case "wh-add-commit": if (S.whAddDonor && S.whAddSink) { stageChange("warehouse_setup", "pair_override", "set", S.whAddDonor, { sinkId: S.whAddSink }); S.whShowAdd = false; S.whAddDonor = ""; S.whAddSink = ""; } break;
      case "route-edit-start": S.whEditRoute = id; break;
      case "route-edit-cancel": S.whEditRoute = null; break;
      case "th-cat-add-toggle": S.thCatShowAdd = !S.thCatShowAdd; S.thCatAdd = ""; break;
      case "th-cat-add-commit": if (S.thCatAdd && !S.thCatLocal.includes(S.thCatAdd)) { S.thCatLocal.push(S.thCatAdd); S.thCatAdd = ""; S.thCatShowAdd = false; } break;
      case "cthresh-clear": stageChange("transfer_thresholds", "category_threshold_clear", "clear", id, {}); S.thCatLocal = S.thCatLocal.filter((x) => x !== id); break;
      case "th-brand-add-toggle": S.thBrandShowAdd = !S.thBrandShowAdd; S.thBrandAdd = ""; break;
      case "th-brand-add-commit": if (S.thBrandAdd && !S.thBrandLocal.includes(S.thBrandAdd)) { S.thBrandLocal.push(S.thBrandAdd); S.thBrandAdd = ""; S.thBrandShowAdd = false; } break;
      case "bthresh-clear": stageChange("transfer_thresholds", "brand_threshold_clear", "clear", id, {}); S.thBrandLocal = S.thBrandLocal.filter((x) => x !== id); break;
      case "pr-brand-add-toggle": S.prBrandShowAdd = !S.prBrandShowAdd; S.prBrandAdd = ""; break;
      case "pr-brand-add-commit": if (S.prBrandAdd) { const b = brands.find((x) => x.id === S.prBrandAdd); const cfg = effProductConfig(); stageChange("product_config", "brand_shelf_life", "set", b.id, { brandId: b.id, brandName: b.name, categoryId: b.categoryId, shelfLifeOverridePct: b.shelfLifeOverridePct ?? cfg.standardShelfLifePct, isActive: true }); S.prBrandAdd = ""; S.prBrandShowAdd = false; } break;
      case "pr-sku-add-toggle": S.prSkuShowAdd = !S.prSkuShowAdd; S.prSkuAdd = ""; break;
      case "pr-sku-add-commit": if (S.prSkuAdd) { const s = skus.find((x) => x.id === S.prSkuAdd); const cfg = effProductConfig(); stageChange("product_config", "sku_config", "set", s.id, { shelfLifeOverridePct: cfg.standardShelfLifePct, isIgnored: s.isIgnored }); S.prSkuAdd = ""; S.prSkuShowAdd = false; } break;
      case "ap-expand": S.apExpanded[id] = !S.apExpanded[id]; break;
      case "ap-authorize": S.apCommitted = true; { orders.forEach((o) => { if (o.batchId === batches[0].id && o.status === "pending") o.status = "in_transit"; }); } break;
      case "ap-reject": S.apReject = true; break;
      case "txn-cancel": { const o = orders.find((x) => x.id === id); if (o) o.status = "cancelled"; break; }
      case "txn-cancel-batch": { orders.forEach((o) => { if (o.batchId === S.txnBatchId && o.status === "pending") o.status = "cancelled"; }); S.txnToast = { type: "success", message: `Cancelled orders for batch ${S.txnBatchId}` }; S.txnBatchId = ""; break; }
      case "txn-cancel-source": { orders.forEach((o) => { if (o.sourceName.toLowerCase() === (S.txnSource || "").toLowerCase() && o.status === "pending") o.status = "cancelled"; }); S.txnToast = { type: "success", message: `Cancelled orders from source warehouse ${S.txnSource}` }; S.txnSource = ""; S.txnBulkBatch = ""; break; }
      case "toast-close": S.txnToast = null; break;
      case "au-expand": S.auExpanded[id] = !S.auExpanded[id]; break;
      case "au-export": exportCSV(); return;
      default: break;
    }
    render();
  }

  /* ═══════════════════════ EVENT WIRING ═══════════════════════ */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-nav],[data-tab],[data-act],[data-toggle],[data-inline],[data-sel-toggle],[data-sel-pick]");
    // close open select if clicking outside it
    if (S.openSel) {
      const root = e.target.closest(`[data-sel-root="${S.openSel}"]`);
      if (!root) { S.openSel = null; S.selQ = ""; render(); }
    }
    if (!t) return;
    if (t.hasAttribute("data-nav")) { S.route = t.getAttribute("data-nav"); S.editKey = null; render(); return; }
    if (t.hasAttribute("data-tab")) { S[t.getAttribute("data-tab")] = t.getAttribute("data-tab-key"); S.editKey = null; render(); return; }
    if (t.hasAttribute("data-sel-toggle")) { const sid = t.getAttribute("data-sel-toggle"); S.openSel = S.openSel === sid ? null : sid; S.selQ = ""; render(); return; }
    if (t.hasAttribute("data-sel-pick")) { handleSelectPick(t.getAttribute("data-sel-pick"), t.getAttribute("data-sel-val")); return; }
    if (t.hasAttribute("data-toggle")) { handleToggle(t.getAttribute("data-toggle")); return; }
    if (t.hasAttribute("data-inline")) { S.editKey = t.getAttribute("data-inline"); S.editDraft = t.getAttribute("data-inline-val") || ""; render(); return; }
    if (t.hasAttribute("data-act")) {
      const act = t.getAttribute("data-act");
      // backdrop only closes when the backdrop itself (not a child) is clicked
      if (act === "backdrop-draft") { if (e.target === t) { S.draftModalOpen = false; render(); } return; }
      if (act === "backdrop-commit") { if (e.target === t) { S.commitModalOpen = false; S.commitResult = false; render(); } return; }
      handleAction(act, t);
      return;
    }
  });

  document.addEventListener("input", (e) => {
    const el = e.target;
    if (el.hasAttribute("data-input")) { const key = el.getAttribute("data-input"); S[key] = el.value; S._focus = { sel: key, caret: el.selectionStart }; render(); return; }
    if (el.hasAttribute("data-inline-input")) { S.editDraft = el.value; return; }
    if (el.hasAttribute("data-sel-search")) { S.selQ = el.value; S._focus = { sel: "__selsearch", caret: el.selectionStart }; render(); return; }
    if (el.hasAttribute("data-csv")) { /* noop */ }
  });
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (el.hasAttribute("data-select")) { S[el.getAttribute("data-select")] = el.value; render(); }
    if (el.hasAttribute("data-csv-input")) { /* noop */ }
    // csv toggle handled via click below
  });
  // csv panel toggle (button carries data-csv)
  document.addEventListener("click", (e) => {
    const b = e.target.closest("[data-csv]");
    if (b) { const idc = b.getAttribute("data-csv"); S.csvOpen = S.csvOpen === idc ? null : idc; render(); }
  });

  document.addEventListener("keydown", (e) => {
    const el = e.target;
    if (el.hasAttribute && el.hasAttribute("data-inline-input")) {
      if (e.key === "Enter") { commitInline(el.getAttribute("data-inline-input"), el.value); }
      else if (e.key === "Escape") { S.editKey = null; S.editDraft = null; render(); }
    }
  });
  document.addEventListener("blur", (e) => {
    const el = e.target;
    if (el.hasAttribute && el.hasAttribute("data-inline-input")) {
      // commit on blur unless focus moving away due to re-render
      commitInline(el.getAttribute("data-inline-input"), el.value);
    }
  }, true);

  // optional deep-linking for demos / documentation captures
  (function initFromUrl() {
    try {
      const hash = decodeURIComponent((location.hash || "").replace(/^#/, ""));
      if (hash) {
        const slash = hash.indexOf("/");
        const route = slash === -1 ? hash : hash.slice(0, slash);
        const tab = slash === -1 ? "" : hash.slice(slash + 1);
        if (route) S.route = route;
        if (tab) {
          if (route === "warehouse") S.whTab = tab;
          else if (route === "product") S.prTab = tab;
          else if (route === "thresholds") S.thTab = tab;
          else if (route === "approval") S.apTab = tab;
          else if (route === "audit") S.auTab = tab;
        }
      }
      const p = new URLSearchParams(location.search);
      if (p.get("stage")) {
        stageChange("warehouse_setup", "donor_participation", "set", "WH-MUM-01", { isParticipating: false });
        stageChange("transfer_thresholds", "global_threshold", "set", null, { field: "cogsMin", value: 75000 });
        stageChange("product_config", "sku_config", "set", "SKU-002", { shelfLifeOverridePct: 60, isIgnored: false });
      }
      if (p.get("modal") === "commit") S.commitModalOpen = true;
      if (p.get("modal") === "draft") S.draftModalOpen = true;
    } catch (e) {}
  })();

  // initial paint
  S._focus = null;
  render();
</script>
</body>
</html>
