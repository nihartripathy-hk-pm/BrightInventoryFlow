    apTab: "Pending Approval", apExpanded: {}, apAuth: "", apCommitted: false, apReject: false,
    txnSearch: "", txnStatus: "all", txnToast: null,
    auTab: "pending", auSearch: "", auModule: "all", auAction: "all", auUser: "all", auExpanded: {},
    // modals
    draftModalOpen: false, commitModalOpen: false, commitResult: false, discardConfirm: false,
    focus: null, // {sel, start, end}
  };

  let _uid = 0;
  const uid = () => `pc_${Date.now().toString(36)}_${_uid++}`;

  // ─── Pending change helpers ──────────────────────────────────────────────────
  function stageChange(module, entity, op, targetId, payload) {
    // dedupe: master_sink dedupes across all master_sink rows; others by (module,entity,targetId)
    if (entity === "master_sink") {
      S.pending = S.pending.filter((c) => c.entity !== "master_sink");
    } else {
      S.pending = S.pending.filter(
        (c) => !(c.module === module && c.entity === entity && (c.targetId ?? null) === (targetId ?? null))
      );
    }
    S.pending.push({ id: uid(), module, entity, op, targetId: targetId ?? null, payload: payload || {}, createdAt: new Date().toISOString() });
  }
  function pendingBy(pred) { return S.pending.filter(pred); }

  // ─── Effective (base + pending) getters ──────────────────────────────────────
  function effMasterSinkId() {
    const p = S.pending.find((c) => c.entity === "master_sink");
    if (p) return p.op === "set" ? p.targetId : null;
    return S.masterSinkId;
  }
  function effDonorParticipating(whId) {
    if (whId === effMasterSinkId()) return false;
    const p = S.pending.find((c) => c.entity === "donor_participation" && c.targetId === whId);
    if (p) return p.payload.isParticipating;
    return donorSettings.find((d) => d.warehouseId === whId)?.isParticipating ?? true;
  }
  function pendingDonorIds() { return new Set(S.pending.filter((c) => c.entity === "donor_participation").map((c) => c.targetId)); }
  function effOverrideSink(donorId) {
    const p = S.pending.find((c) => c.entity === "pair_override" && c.targetId === donorId);
    if (p) return p.op === "set" ? p.payload.sinkId : null;
    const ex = overrides.find((o) => o.donorWarehouseId === donorId && o.isActive);
    return ex ? ex.sinkWarehouseId : null;
  }
  function pendingOverrideIds() { return new Set(S.pending.filter((c) => c.entity === "pair_override").map((c) => c.targetId)); }
  </script>

  <script id="views-2">
  /* ═══════════════════════ WAREHOUSE PAGE ═══════════════════════ */
  function pageWarehouse() {
    const sinkId = effMasterSinkId();
    const active = warehouses.filter((w) => w.isActive);
    const participating = active.filter((w) => w.id !== sinkId && effDonorParticipating(w.id)).length;
    const bypassed = active.filter((w) => w.id !== sinkId).length - participating;
    const sinkName = active.find((w) => w.id === sinkId)?.name ?? sinkId;
    const pMasterSink = S.pending.some((c) => c.entity === "master_sink");

    const tabs = [
      { key: "network", label: "Warehouse Network" },
      { key: "donor", label: "Donor Network" },
      { key: "routes", label: "Route Pair Overrides" },
    ];

    let body = "";
    if (S.whTab === "network") body = whNetwork(active, sinkId, pMasterSink);
    else if (S.whTab === "donor") body = whDonor(active, sinkId);
    else body = whRoutes(active, sinkId, sinkName);

    return `<div class="p-8">
      <div class="mb-6">
        <div class="flex items-start justify-between gap-4">
          <div><h1 class="text-2xl font-semibold text-primary">Warehouse Setup</h1><p class="text-muted text-sm mt-1">Configure routing destinations and donor participation</p></div>
          ${sinkId ? `<span class="flex items-center gap-1.5 text-xs text-accent bg-accent/10 px-3 py-1.5 rounded-full border border-accent/20 whitespace-nowrap flex-shrink-0">${ICON.pin}Master Sink: ${esc(sinkName)}</span>` : ""}
        </div>
        <div class="flex items-center gap-3 mt-4 flex-wrap">
          <span class="text-xs text-muted bg-row px-3 py-1.5 rounded-full border border-border">${active.length} warehouses</span>
          <span class="text-xs text-green-400 bg-green-900/20 px-3 py-1.5 rounded-full border border-green-800/30">${participating} participating</span>
          <span class="text-xs text-red-400 bg-red-900/20 px-3 py-1.5 rounded-full border border-red-800/30">${bypassed} bypassed</span>
        </div>
      </div>
      ${tabBar(tabs, S.whTab, "whTab")}
      <div class="mt-6">${body}</div>
    </div>`;
  }

  function whNetwork(active, sinkId, pMasterSink) {
    const q = S.whNetQ;
    const filtered = q
      ? active.filter((w) => [w.name, w.id, w.city, w.locationCode].some((x) => x.toLowerCase().includes(q.toLowerCase())))
      : active.filter((w) => w.id === sinkId);
    const cards = filtered.map((w) => {
      const isSink = w.id === sinkId;
      const capColor = w.capacityPct >= 80 ? "bg-red-500" : w.capacityPct >= 60 ? "bg-amber-500" : "bg-green-500";
      return `<div class="bg-card border rounded-xl p-4 transition-all ${isSink ? "border-accent ring-1 ring-accent/20" : "border-border hover:border-border/80"}">
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0"><div class="font-medium text-primary truncate">${esc(w.name)}</div><div class="text-xs text-muted font-mono mt-0.5">${w.id} · ${esc(w.city)}</div></div>
          ${isSink ? `<span class="shrink-0 text-xs px-2 py-0.5 rounded-full bg-accent/20 text-accent border border-accent/30 whitespace-nowrap">Master Sink</span>` : `<span class="shrink-0 text-xs px-2 py-0.5 rounded-full bg-row text-muted border border-border whitespace-nowrap">Donor</span>`}
        </div>
        <div class="text-xs text-muted mt-2">${nf(w.stockUnits)} units</div>
        <div class="h-1.5 rounded-full bg-[#1e2333] mt-2"><div class="h-1.5 rounded-full transition-all ${capColor}" style="width:${Math.min(100, w.capacityPct)}%"></div></div>
        <div class="text-xs text-muted mt-1">${w.capacityPct}% capacity</div>
        ${isSink ? `<p class="text-xs text-muted mt-3 bg-accent/5 rounded p-2">📍 All liquidated inventory routes here</p>`
          : `<button data-act="set-sink" data-id="${w.id}" class="w-full mt-3 py-1.5 text-xs border border-border hover:border-accent hover:text-accent text-muted rounded-lg transition-colors">Set as Master Sink</button>`}
      </div>`;
    }).join("");
    let empty = "";
    if (filtered.length === 0) empty = `<div class="col-span-full text-center text-sm text-muted py-12 border border-dashed border-border rounded-xl">${q ? `No warehouses match &ldquo;${esc(q)}&rdquo;` : "No master sink configured. Search a warehouse above to set one."}</div>`;
    return `<div>
      <div class="flex items-center gap-3 mb-4">
        <input data-input="whNetQ" value="${esc(q)}" placeholder="Search warehouses to change master sink…" class="flex-1 max-w-sm bg-row border border-border rounded-lg px-3 py-2 text-sm text-primary placeholder:text-muted-dark focus:outline-none focus:border-accent transition-colors" />
        ${pMasterSink ? pendingBadge() : ""}
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">${cards}${empty}</div>
    </div>`;
  }

  function whDonor(active, sinkId) {
    const q = S.whDonorQ, f = S.whDonorFilter;
    const pIds = pendingDonorIds();
    const filtered = active.filter((w) => {
      if (q) { const ql = q.toLowerCase(); if (![w.name, w.id, w.city].some((x) => x.toLowerCase().includes(ql))) return false; }
      if (f === "all") return true;
      const p = effDonorParticipating(w.id);
      if (w.id === sinkId) return f === "disabled";
      return f === "enabled" ? p : !p;
    });
    const filters = [["all", "All"], ["enabled", "Enabled"], ["disabled", "Disabled"]];
    const rows = filtered.map((w) => {
      const isSink = w.id === sinkId;
      const part = effDonorParticipating(w.id);
      const statusBadge = isSink
        ? `<span class="text-xs px-2 py-0.5 rounded-full bg-accent/10 text-accent border border-accent/20">Master Sink</span>`
        : part
          ? `<span class="text-xs px-2 py-0.5 rounded-full bg-green-900/20 text-green-400 border border-green-800/30">Participating</span>`
          : `<span class="text-xs px-2 py-0.5 rounded-full bg-red-900/20 text-red-400 border border-red-800/30">Bypassed</span>`;
      return `<tr class="border-b border-border transition-opacity ${isSink ? "opacity-50" : ""}">
        <td class="py-3 pr-4"><div class="font-medium text-primary">${esc(w.name)}</div><div class="text-xs text-muted font-mono mt-0.5">${w.id}</div></td>
        <td class="py-3 pr-4"><div class="text-sm text-muted">${esc(w.city)}</div><div class="text-xs text-muted-dark">${w.locationCode}</div></td>
        <td class="py-3 pr-4 text-right text-sm text-muted">${nf(w.stockUnits)}</td>
        <td class="py-3 pr-4 text-center"><div class="flex items-center justify-center gap-1.5">${statusBadge}${pIds.has(w.id) ? pendingBadge() : ""}</div></td>
        <td class="py-3 text-center">${toggle(part, `donor:${w.id}`, isSink)}</td>
      </tr>`;
    }).join("");
    return `<div>
      <div class="flex gap-3 bg-violet-900/15 border border-violet-800/30 rounded-xl px-4 py-3 mb-4">
        <svg class="w-4 h-4 text-violet-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8h.01M12 12v4"/></svg>
        <p class="text-xs text-muted leading-relaxed"><span class="text-violet-400 font-semibold">Bypassed donors</span> are invisible to the liquidation engine — no transfers will be suggested or executed from them. The Master Sink is automatically protected from donor participation.</p>
      </div>
      ${csvPanel("Donor Network Bulk Upload", ["warehouse_id", "participation"])}
      <div class="flex items-center gap-2 mb-4 flex-wrap">
        <div class="relative flex-1 min-w-[200px]"><span class="absolute left-3 top-1/2 -translate-y-1/2">${ICON.search}</span><input data-input="whDonorQ" value="${esc(q)}" placeholder="Search warehouse name, ID, city..." class="w-full bg-row border border-border rounded-lg pl-8 pr-3 py-2 text-sm text-primary placeholder:text-muted-dark focus:outline-none focus:border-accent transition-colors" /></div>
        <div class="flex items-center rounded-lg border border-border overflow-hidden">${filters.map(([k, l]) => `<button data-act="whDonorFilter" data-val="${k}" class="px-3 py-2 text-xs font-medium transition-colors ${f === k ? "bg-accent/10 text-accent" : "text-muted hover:text-primary"}">${l}</button>`).join("")}</div>
        <span class="text-xs text-muted-dark whitespace-nowrap">${filtered.length} / ${active.length}</span>
      </div>
      <div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-xs text-muted uppercase tracking-wider border-b border-border">
        <th class="text-left pb-2 font-medium">Warehouse</th><th class="text-left pb-2 font-medium">Location</th><th class="text-right pb-2 font-medium">Stock</th><th class="text-center pb-2 font-medium">Status</th><th class="text-center pb-2 font-medium">Participation</th>
      </tr></thead><tbody>${rows || `<tr><td colspan="5" class="text-center text-muted py-10 text-sm">No warehouses match this filter.</td></tr>`}</tbody></table></div>
    </div>`;
  }

  function whRoutes(active, sinkId, sinkName) {
    const pIds = pendingOverrideIds();
    const donors = active.filter((w) => w.id !== sinkId);
    const withOverride = donors.filter((w) => effOverrideSink(w.id) !== null);
    const srcQ = S.whRouteSrcQ, dstQ = S.whRouteDstQ;
    const filtered = withOverride.filter((w) => {
      if (srcQ) { const q = srcQ.toLowerCase(); if (![w.name, w.id, w.city].some((x) => x.toLowerCase().includes(q))) return false; }
      if (dstQ) { const q = dstQ.toLowerCase(); const sid = effOverrideSink(w.id); const dn = sid ? (active.find((x) => x.id === sid)?.name ?? sid) : sinkName; if (!dn.toLowerCase().includes(q)) return false; }
      return true;
    });
    const donorOpts = donors.filter((w) => effOverrideSink(w.id) === null).map((w) => ({ id: w.id, name: w.name }));
    const sinkOpts = active.filter((w) => w.id !== S.whAddDonor).map((w) => ({ id: w.id, name: w.name }));

    const rows = filtered.map((w) => {
      const sid = effOverrideSink(w.id);
      const sName = sid ? (active.find((x) => x.id === sid)?.name ?? sid) : null;
      const editing = S.whEditRoute === w.id;
      const dest = editing
        ? `<div class="flex items-center gap-2">${searchSelect("routeEdit_" + w.id, active.filter((x) => x.id !== w.id).map((x) => ({ id: x.id, name: x.name })), sid ?? "", `route-edit:${w.id}`)}<button data-act="route-edit-cancel" class="text-xs text-muted hover:text-primary px-1">✕</button></div>`
        : `<div class="flex items-center gap-2 group"><div><div class="text-sm text-primary">${esc(sName)}</div><div class="text-xs text-muted font-mono">${sid}</div></div><button data-act="route-edit-start" data-id="${w.id}" class="opacity-0 group-hover:opacity-100 transition-opacity text-muted hover:text-accent" title="Change destination"><svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536M9 13l6.586-6.586a2 2 0 012.828 2.828L11.828 15.828A2 2 0 0110 16.414H8v-2a2 2 0 01.586-1.414z"/></svg></button>${pIds.has(w.id) ? pendingBadge() : ""}</div>`;
      return `<tr class="border-b border-border">
        <td class="py-3 pr-4"><div class="font-medium text-primary">${esc(w.name)}</div><div class="text-xs text-muted font-mono mt-0.5">${w.id} · ${esc(w.city)}</div></td>
        <td class="py-3 text-center"><svg class="w-4 h-4 inline text-violet-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg></td>
        <td class="py-3 pr-4">${dest}</td>
        <td class="py-3 text-center">${toggle(true, `route-off:${w.id}`, false)}</td>
      </tr>`;
    }).join("");

    return `<div>
      <div class="flex gap-3 bg-teal-900/15 border border-teal-800/30 rounded-xl px-4 py-3 mb-4">
        <svg class="w-4 h-4 text-teal-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" stroke-linejoin="round" d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg>
        <p class="text-xs text-muted leading-relaxed">This list shows only donor warehouses with an active Route Pair Override. All other donors route to the <strong class="text-primary">${esc(sinkName)}</strong> by default. Use <span class="text-accent font-medium">+ Add override</span> or the CSV upload to create new overrides.</p>
      </div>
      ${csvPanel("Route Pair Overrides Bulk Upload", ["donor_id", "sink_id", "override_active"])}
      <div class="flex items-center gap-2 mb-4 flex-wrap">
        <div class="relative flex-1 min-w-[160px]"><span class="absolute left-3 top-1/2 -translate-y-1/2">${ICON.search}</span><input data-input="whRouteSrcQ" value="${esc(srcQ)}" placeholder="Search source..." class="w-full bg-row border border-border rounded-lg pl-8 pr-3 py-2 text-sm text-primary placeholder:text-muted-dark focus:outline-none focus:border-accent transition-colors" /></div>
        <div class="relative flex-1 min-w-[160px]"><span class="absolute left-3 top-1/2 -translate-y-1/2">${ICON.search}</span><input data-input="whRouteDstQ" value="${esc(dstQ)}" placeholder="Search destination..." class="w-full bg-row border border-border rounded-lg pl-8 pr-3 py-2 text-sm text-primary placeholder:text-muted-dark focus:outline-none focus:border-accent transition-colors" /></div>
        <button data-act="wh-toggle-add" class="px-3 py-2 text-xs font-medium bg-accent/10 text-accent border border-accent/30 rounded-lg hover:bg-accent/20 transition-colors whitespace-nowrap">${S.whShowAdd ? "Cancel" : "+ Add override"}</button>
        <span class="text-xs text-muted-dark whitespace-nowrap">${filtered.length} override${filtered.length === 1 ? "" : "s"}</span>
      </div>
      ${S.whShowAdd ? `<div class="bg-card border border-accent/30 rounded-xl p-4 mb-4 flex flex-wrap items-end gap-3">
        <div><p class="text-[10px] uppercase tracking-wider text-muted mb-1">Donor</p>${searchSelect("addDonor", donorOpts, S.whAddDonor, "wh-add-donor", { placeholder: "Pick donor…", searchPlaceholder: "Search donor…" })}</div>
        <svg class="w-4 h-4 text-muted mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        <div><p class="text-[10px] uppercase tracking-wider text-muted mb-1">Sink</p>${searchSelect("addSink", sinkOpts, S.whAddSink, "wh-add-sink", { placeholder: "Pick sink…", searchPlaceholder: "Search sink…" })}</div>
        <button data-act="wh-add-commit" ${!S.whAddDonor || !S.whAddSink ? "disabled" : ""} class="px-3 py-1.5 text-xs font-medium bg-accent text-white rounded-md hover:bg-accent-hover transition-colors disabled:opacity-40 disabled:cursor-not-allowed">Add override</button>
      </div>` : ""}
      <div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-xs text-muted uppercase tracking-wider border-b border-border">
        <th class="text-left pb-2 font-medium">Source (Donor)</th><th class="text-center pb-2 font-medium w-6"></th><th class="text-left pb-2 font-medium">Destination (Sink)</th><th class="text-center pb-2 font-medium">Override</th>
      </tr></thead><tbody>${rows || `<tr><td colspan="4" class="text-center text-muted py-10 text-sm">${withOverride.length === 0 ? "No route pair overrides yet. Use + Add override or the CSV upload above." : "No overrides match the current search."}</td></tr>`}</tbody></table></div>
    </div>`;
  }

  /* ═══════════════════════ THRESHOLDS PAGE ═══════════════════════ */
  function effGlobalThresh() {
    const o = Object.assign({}, thresholdsGlobal);
    S.pending.filter((c) => c.module === "transfer_thresholds" && c.entity === "global_threshold").forEach((c) => { o[c.payload.field] = c.payload.value; });
    return o;
  }
  function pendingGlobalThreshFields() { return new Set(S.pending.filter((c) => c.entity === "global_threshold").map((c) => c.payload.field)); }
  function effCatThresh(catId) {
    const base = categoryThresholds.find((c) => c.categoryId === catId) || null;
    const o = base ? Object.assign({}, base) : null;
    const clear = S.pending.find((c) => c.entity === "category_threshold_clear" && c.targetId === catId);
    if (clear) return null;
    const patches = S.pending.filter((c) => c.entity === "category_threshold" && c.payload.categoryId === catId);
    if (patches.length && !o) return patches.reduce((a, c) => { a[c.payload.field] = c.payload.value; return a; }, {});
    if (patches.length && o) { patches.forEach((c) => { o[c.payload.field] = c.payload.value; }); }
    return o;
  }
  function pendingCatIds() { const s = new Set(); S.pending.forEach((c) => { if (c.entity === "category_threshold") s.add(c.payload.categoryId); if (c.entity === "category_threshold_clear") s.add(c.targetId); }); return s; }
  function effBrandThresh(brandId) {
    const base = brandThresholds.find((b) => b.brandId === brandId) || null;
    const clear = S.pending.find((c) => c.entity === "brand_threshold_clear" && c.targetId === brandId);
    if (clear) return null;
    const o = base ? Object.assign({}, base) : {};
    const patches = S.pending.filter((c) => c.entity === "brand_threshold" && c.payload.brandId === brandId);
    if (!base && !patches.length) return null;
    patches.forEach((c) => { o[c.payload.field] = c.payload.value; });
    return o;
  }
  function pendingBrandThreshIds() { const s = new Set(); S.pending.forEach((c) => { if (c.entity === "brand_threshold") s.add(c.payload.brandId); if (c.entity === "brand_threshold_clear") s.add(c.targetId); }); return s; }

  function pageThresholds() {
    const tabs = [{ key: "global", label: "Global Default" }, { key: "category", label: "Category Overrides" }, { key: "brand", label: "Brand Overrides" }];
    let body = "";
    if (S.thTab === "global") body = thGlobal();
    else if (S.thTab === "category") body = thCategory();
    else body = thBrand();
    return `<div class="p-8">
      <div class="mb-6"><h1 class="text-2xl font-semibold text-primary">Transfer Thresholds</h1><p class="text-muted text-sm mt-1">Minimum viable load — financial circuit breaker for liquidation transfers</p></div>
      ${tabBar(tabs, S.thTab, "thTab")}
      <div class="mt-6">${body}</div>
    </div>`;
  }

  function thresholdRow(icon, label, minKey, maxKey, minVal, maxVal, opts, pFields) {
    opts = opts || {};
    const configured = minVal !== null || maxVal !== null;
    const pend = pFields.has(minKey) || pFields.has(maxKey);
    return `<div class="bg-card border border-border rounded-xl p-4 mb-3"><div class="flex items-center gap-4">
      <div class="flex items-center gap-2 w-40 shrink-0"><svg class="w-4 h-4 text-muted shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${icon}"/></svg><span class="text-sm font-medium text-primary">${label}</span></div>
      <div class="flex items-center gap-2 flex-1">
        <span class="text-xs text-muted-dark uppercase tracking-wider">MIN</span>${inlineEdit("g_" + minKey, minVal, "gthresh:" + minKey, opts)}
        <span class="text-muted-dark">—</span>
        <span class="text-xs text-muted-dark uppercase tracking-wider">MAX</span>${inlineEdit("g_" + maxKey, maxVal, "gthresh:" + maxKey, opts)}
      </div>
      <div class="shrink-0 flex items-center gap-1.5">${configured ? `<span class="text-xs px-2 py-0.5 rounded-full bg-teal-900/20 text-teal-400 border border-teal-800/30">Configured</span>` : `<span class="text-xs px-2 py-0.5 rounded-full bg-row text-muted border border-border">Not set</span>`}${pend ? pendingBadge() : ""}</div>
    </div></div>`;
  }

  function thGlobal() {
    const g = effGlobalThresh();
    const pf = pendingGlobalThreshFields();
    const tiers = [
      { tier: "TIER 01", label: "Brand Override", desc: "Per-brand", active: false },
      { tier: "TIER 02", label: "Category Override", desc: "Per-category", active: false },
      { tier: "TIER 03", label: "Global Default", desc: "Network-wide", active: true },
    ];
    const tierRow = tiers.map((t, i) => `<div class="flex-1 rounded-lg p-3 border ${t.active ? "border-accent bg-accent/5" : "border-border bg-card"}"><div class="text-xs text-muted">${t.tier}</div><div class="text-sm font-medium ${t.active ? "text-accent" : "text-primary"}">${t.label}</div><div class="text-xs text-muted-dark">${t.desc}</div></div>${i < 2 ? `<svg class="w-4 h-4 text-muted flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>` : ""}`).join("");
    return `<div>
      <div class="flex items-center gap-2 mb-6">${tierRow}</div>
      ${thresholdRow("M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z", "COGS", "cogsMin", "cogsMax", g.cogsMin, g.cogsMax, { prefix: "₹" }, pf)}
      ${thresholdRow("M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4", "Units", "unitsMin", "unitsMax", g.unitsMin, g.unitsMax, { suffix: " units" }, pf)}
      ${thresholdRow("M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3", "Weight", "weightMin", "weightMax", g.weightMin, g.weightMax, { suffix: " kg" }, pf)}
      ${g.updateDt ? `<p class="text-xs text-muted-dark mt-3">Last updated: ${g.updateDt}</p>` : ""}
    </div>`;
  }

  function overrideThreshTable(kind, visibleList, pIds, addOpts) {
    // kind: 'cat' or 'brand'
    const isCat = kind === "cat";
    const rows = visibleList.map((item) => {
      const ov = item.override;
      const has = ov && (ov.cogsMin != null || ov.cogsMax != null || ov.unitsMin != null || ov.unitsMax != null || ov.weightMin != null || ov.weightMax != null);
      const idPrefix = isCat ? "c_" : "b_";
      const act = isCat ? "cthresh" : "bthresh";
      const nameCell = isCat
        ? `<div class="font-medium text-primary">${esc(item.name)}</div><div class="text-xs text-muted-dark font-mono">${item.id}</div>`
        : `<div class="font-medium text-primary">${esc(item.name)}</div><div class="text-xs text-muted-dark mt-0.5 font-mono">${item.categoryId}</div><div class="text-xs text-muted font-mono">${item.id}</div>`;
      const statusLabel = has ? (isCat ? "Category Override" : "Brand Override") : "Using Global";
      return `<tr class="border-b border-border">
        <td class="py-3 pr-4">${nameCell}</td>
        <td class="py-3 text-center">${inlineEdit(idPrefix + item.id + "_cogsMin", ov?.cogsMin ?? null, `${act}:${item.id}:cogsMin`, { prefix: "₹" })}</td>
        <td class="py-3 pr-4 text-center">${inlineEdit(idPrefix + item.id + "_cogsMax", ov?.cogsMax ?? null, `${act}:${item.id}:cogsMax`, { prefix: "₹" })}</td>
        <td class="py-3 text-center">${inlineEdit(idPrefix + item.id + "_unitsMin", ov?.unitsMin ?? null, `${act}:${item.id}:unitsMin`, {})}</td>
        <td class="py-3 pr-4 text-center">${inlineEdit(idPrefix + item.id + "_unitsMax", ov?.unitsMax ?? null, `${act}:${item.id}:unitsMax`, {})}</td>
        <td class="py-3 text-center">${inlineEdit(idPrefix + item.id + "_weightMin", ov?.weightMin ?? null, `${act}:${item.id}:weightMin`, { suffix: " kg" })}</td>
        <td class="py-3 pr-4 text-center">${inlineEdit(idPrefix + item.id + "_weightMax", ov?.weightMax ?? null, `${act}:${item.id}:weightMax`, { suffix: " kg" })}</td>
        <td class="py-3 pr-4 text-center"><div class="flex items-center justify-center gap-1.5">${has ? `<span class="text-xs px-2 py-0.5 rounded-full bg-teal-900/20 text-teal-400 border border-teal-800/30 whitespace-nowrap">${statusLabel}</span>` : `<span class="text-xs px-2 py-0.5 rounded-full bg-row text-muted border border-border whitespace-nowrap">Using Global</span>`}${pIds.has(item.id) ? pendingBadge() : ""}</div></td>
        <td class="py-3 text-center">${has ? `<button data-act="${isCat ? "cthresh-clear" : "bthresh-clear"}" data-id="${item.id}" title="Clear override" class="text-red-400 hover:text-red-300 transition-colors">${ICON.xmark}</button>` : ""}</td>
      </tr>`;
    }).join("");
    return `<div class="overflow-x-auto"><table class="w-full text-sm"><thead>
      <tr class="text-xs text-muted uppercase tracking-wider border-b border-border"><th class="text-left pb-2 font-medium pr-4">${isCat ? "Category" : "Brand"}</th><th class="text-center pb-2 font-medium pr-4" colspan="2">COGS</th><th class="text-center pb-2 font-medium pr-4" colspan="2">Units</th><th class="text-center pb-2 font-medium pr-4" colspan="2">Weight</th><th class="text-center pb-2 font-medium pr-4">Status</th><th class="text-center pb-2 font-medium">Clear</th></tr>
      <tr class="text-xs text-muted-dark border-b border-border"><th class="pb-2 pr-4"></th><th class="pb-2 font-normal text-center">Min</th><th class="pb-2 font-normal text-center pr-4">Max</th><th class="pb-2 font-normal text-center">Min</th><th class="pb-2 font-normal text-center pr-4">Max</th><th class="pb-2 font-normal text-center">Min</th><th class="pb-2 font-normal text-center pr-4">Max</th><th class="pb-2 pr-4"></th><th class="pb-2"></th></tr>
      </thead><tbody>${rows || `<tr><td colspan="9" class="text-center text-muted py-12 text-sm">No ${isCat ? "category" : "brand"} overrides yet. Use + Add override to create one.</td></tr>`}</tbody></table></div>`;
  }

  function thCategory() {
    const pIds = pendingCatIds();
    const committed = new Set(categoryThresholds.filter((c) => c.cogsMin != null || c.cogsMax != null || c.unitsMin != null || c.unitsMax != null || c.weightMin != null || c.weightMax != null).map((c) => c.categoryId));
    const visibleIds = new Set([...committed, ...pIds, ...S.thCatLocal]);
    const visible = categories.filter((c) => visibleIds.has(c.id)).map((c) => ({ id: c.id, name: c.name, override: effCatThresh(c.id) }));
    const addable = categories.filter((c) => !visibleIds.has(c.id)).map((c) => ({ id: c.id, name: c.name }));
    return `<div>
      <div class="flex items-center justify-between mb-4"><span class="text-xs text-muted">${visible.length} categor${visible.length === 1 ? "y" : "ies"} with overrides</span><button data-act="th-cat-add-toggle" class="px-3 py-2 text-xs font-medium bg-accent/10 text-accent border border-accent/30 rounded-lg hover:bg-accent/20 transition-colors">${S.thCatShowAdd ? "Cancel" : "+ Add override"}</button></div>
      ${S.thCatShowAdd ? `<div class="bg-card border border-accent/30 rounded-xl p-4 mb-4 flex flex-wrap items-end gap-3"><div><p class="text-[10px] uppercase tracking-wider text-muted mb-1">Category</p>${searchSelect("thCatAdd", addable, S.thCatAdd, "th-cat-add-pick", { placeholder: "Pick category…", searchPlaceholder: "Search category…" })}</div><button data-act="th-cat-add-commit" ${!S.thCatAdd ? "disabled" : ""} class="px-3 py-1.5 text-xs font-medium bg-accent text-white rounded-md hover:bg-accent-hover transition-colors disabled:opacity-40 disabled:cursor-not-allowed">Add override</button></div>` : ""}
      ${overrideThreshTable("cat", visible, pIds)}
    </div>`;
  }

  function thBrand() {
    const pIds = pendingBrandThreshIds();
    const committed = new Set(brandThresholds.filter((b) => b.cogsMin != null || b.cogsMax != null || b.unitsMin != null || b.unitsMax != null || b.weightMin != null || b.weightMax != null).map((b) => b.brandId));
    const visibleIds = new Set([...committed, ...pIds, ...S.thBrandLocal]);
    const catName = (cid) => categories.find((c) => c.id === cid)?.name ?? cid;
    const visible = brands.filter((b) => visibleIds.has(b.id)).map((b) => ({ id: b.id, name: b.name, categoryId: b.categoryId, override: effBrandThresh(b.id) }));
    const addable = brands.filter((b) => !visibleIds.has(b.id)).map((b) => ({ id: b.id, name: b.name }));
    return `<div>
      <div class="flex items-center justify-between mb-4"><span class="text-xs text-muted">${visible.length} brand${visible.length === 1 ? "" : "s"} with overrides</span><button data-act="th-brand-add-toggle" class="px-3 py-2 text-xs font-medium bg-accent/10 text-accent border border-accent/30 rounded-lg hover:bg-accent/20 transition-colors">${S.thBrandShowAdd ? "Cancel" : "+ Add override"}</button></div>
      ${S.thBrandShowAdd ? `<div class="bg-card border border-accent/30 rounded-xl p-4 mb-4 flex flex-wrap items-end gap-3"><div><p class="text-[10px] uppercase tracking-wider text-muted mb-1">Brand</p>${searchSelect("thBrandAdd", addable, S.thBrandAdd, "th-brand-add-pick", { placeholder: "Pick brand…", searchPlaceholder: "Search brand…" })}</div><button data-act="th-brand-add-commit" ${!S.thBrandAdd ? "disabled" : ""} class="px-3 py-1.5 text-xs font-medium bg-accent text-white rounded-md hover:bg-accent-hover transition-colors disabled:opacity-40 disabled:cursor-not-allowed">Add override</button></div>` : ""}
      ${overrideThreshTable("brand", visible, pIds)}
    </div>`;
  }
  </script>
  <script id="product">
  /* ═══════════════════════ PRODUCT PAGE ═══════════════════════ */
  function effProductConfig() {
    const o = Object.assign({}, productConfig);
    S.pending.filter((c) => c.entity === "global_product_config").forEach((c) => { o[c.payload.field] = c.payload.value; });
    return o;
  }
  function pendingProdGlobalFields() { return new Set(S.pending.filter((c) => c.entity === "global_product_config").map((c) => c.payload.field)); }
  function effBrand(b) {
    const p = S.pending.find((c) => c.entity === "brand_shelf_life" && (c.payload.brandId === b.id || c.targetId === b.id));
    if (p) return Object.assign({}, b, { shelfLifeOverridePct: p.payload.shelfLifeOverridePct ?? null, isActive: p.payload.isActive ?? false });
    return b;
  }
  function effSku(s) {
    const p = S.pending.find((c) => c.entity === "sku_config" && c.targetId === s.id);
    if (p) return Object.assign({}, s, { shelfLifeOverridePct: p.payload.shelfLifeOverridePct ?? null, isIgnored: p.payload.isIgnored ?? false });
    return s;
  }
  function effCondition(c) {
    const p = S.pending.find((x) => x.entity === "inventory_condition" && x.targetId === c.conditionType);
    if (p) return Object.assign({}, c, { isEnabled: p.payload.enabled });
    return c;
  }
  function pendingBrandIds() { return new Set(S.pending.filter((c) => c.entity === "brand_shelf_life").map((c) => c.payload.brandId ?? c.targetId)); }
  function pendingSkuIds() { return new Set(S.pending.filter((c) => c.entity === "sku_config").map((c) => c.targetId)); }
  function pendingCondIds() { return new Set(S.pending.filter((c) => c.entity === "inventory_condition").map((c) => c.targetId)); }

  function pageProduct() {
    const cfg = effProductConfig();
    const effBrands = brands.map(effBrand);
    const effSkus = skus.map(effSku);
    const brandOverrides = effBrands.filter((b) => b.isActive && b.shelfLifeOverridePct !== null).length;
    const skuOverrides = effSkus.filter((s) => s.shelfLifeOverridePct !== null).length;
    const ignored = effSkus.filter((s) => s.isIgnored).length;
    const tabs = [
      { key: "global", label: "Global Rules" },
      { key: "brands", label: "Brand Overrides" },
      { key: "skus", label: "SKU Configuration" },
      { key: "conditions", label: "Inventory Conditions" },
    ];
    let body = "";
    if (S.prTab === "global") body = prGlobal(cfg, effSkus);
    else if (S.prTab === "brands") body = prBrands(effBrands, cfg);
    else if (S.prTab === "skus") body = prSkus(effSkus, effBrands, cfg);
    else body = prConditions();
    return `<div class="p-8">
      <div class="mb-6 flex items-start justify-between gap-6">
        <div><h1 class="text-2xl font-semibold text-primary">Product Configuration</h1><p class="text-muted text-sm mt-1">Shelf life thresholds · Eligibility rules · SKU overrides · Inventory conditions</p></div>
        <div class="flex items-start gap-8">
          <div class="text-right"><p class="text-2xl font-semibold text-blue-400 leading-none">${brandOverrides}</p><p class="text-xs text-muted mt-1">Brand Overrides</p></div>
          <div class="text-right"><p class="text-2xl font-semibold text-violet-400 leading-none">${skuOverrides}</p><p class="text-xs text-muted mt-1">SKU Overrides</p></div>
          <div class="text-right"><p class="text-2xl font-semibold text-red-400 leading-none">${ignored}</p><p class="text-xs text-muted mt-1">Ignored SKUs</p></div>
        </div>
      </div>
      ${tabBar(tabs, S.prTab, "prTab")}
      <div class="mt-6">${body}</div>
    </div>`;
  }

  function prGlobal(cfg, effSkus) {
    const pf = pendingProdGlobalFields();
    const stdCount = skus.filter((s) => s.type === "standard").length;
    const opCount = skus.filter((s) => s.type === "op").length;
    const tier = (num, badge, badgeCls, title, sub) => `<div class="bg-row border border-border rounded-lg p-4"><p class="text-[10px] font-mono text-muted tracking-wider mb-2">TIER ${num}</p><span class="inline-block text-xs font-medium ${badgeCls} px-2.5 py-1 rounded-md mb-2">${badge}</span><p class="text-sm text-primary font-medium">${title}</p><p class="text-xs text-muted italic mt-0.5">${sub}</p></div>`;
    const arrow = `<svg class="w-4 h-4 text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>`;
    const eligRow = (title, badge, badgeCls, desc, field, enabled) => `<div class="bg-row/40 border border-border rounded-lg p-4 flex items-center gap-4">
      <div class="flex-1"><div class="flex items-center gap-2 mb-1"><p class="text-sm text-primary font-semibold">${title}</p><span class="text-[10px] font-medium ${badgeCls} px-1.5 py-0.5 rounded">${badge}</span></div><p class="text-xs text-muted">${desc}</p></div>
      <button class="text-xs text-primary bg-row border border-border hover:border-accent/40 px-3 py-1.5 rounded-md flex items-center gap-1 transition-colors">Manage SKUs<svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg></button>
      <div class="flex items-center gap-2">${pf.has(field) ? pendingBadge() : ""}<span class="text-xs font-medium ${enabled ? "text-green-400" : "text-muted"}">${enabled ? "Enabled" : "Disabled"}</span>${toggle(enabled, "prod-global-bool:" + field, false)}</div></div>`;
    return `<div class="space-y-4">
      <div class="bg-card border border-border rounded-xl p-5">
        <div class="flex items-center gap-2 mb-4"><svg class="w-4 h-4 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path stroke-linecap="round" d="M6 8v2a2 2 0 002 2h8a2 2 0 002-2V8M12 12v4"/></svg><h3 class="text-sm font-semibold text-primary">Precedence Hierarchy</h3><span class="text-xs text-muted">Highest wins</span></div>
        <div class="grid grid-cols-[1fr_auto_1fr_auto_1fr] items-center gap-3">
          ${tier("01", "SKU Override", "bg-violet-900/30 text-violet-400 border border-violet-800/30", "Per-SKU threshold", "Highest priority")}${arrow}${tier("02", "Brand Override", "bg-accent/15 text-accent border border-accent/30", "Per-brand threshold", "Falls back if SKU null")}${arrow}${tier("03", "Global Default", "bg-row text-muted border border-border", "System-wide baseline", "Lowest priority")}
        </div>
      </div>
      <div class="bg-card border border-border rounded-xl p-5">
        <div class="flex items-start justify-between mb-4"><div><h3 class="text-sm font-semibold text-primary">Global Shelf Life Threshold</h3><p class="text-xs text-muted mt-1">Default liquidation trigger — applied when no Brand or SKU override exists</p></div><span class="text-xs bg-row text-muted border border-border px-2.5 py-1 rounded-md whitespace-nowrap">System Default</span></div>
        <div class="grid grid-cols-2 gap-6 mt-2">
          <div class="bg-row/40 border border-border rounded-lg p-4 space-y-4"><p class="text-xs font-medium text-muted uppercase tracking-wider">Standard SKUs</p>
            <div class="flex items-center justify-between"><p class="text-xs text-muted flex items-center gap-2">Min ${pf.has("standardShelfLifeMinPct") ? pendingBadge() : ""}</p>${inlineEdit("p_stdMin", cfg.standardShelfLifeMinPct, "prod-global:standardShelfLifeMinPct", { suffix: "%" })}</div>
            <div class="flex items-center justify-between"><p class="text-xs text-muted flex items-center gap-2">Max ${pf.has("standardShelfLifePct") ? pendingBadge() : ""}</p>${inlineEdit("p_stdMax", cfg.standardShelfLifePct, "prod-global:standardShelfLifePct", { suffix: "%" })}</div>
          </div>
          <div class="bg-row/40 border border-border rounded-lg p-4 space-y-4"><p class="text-xs font-medium text-muted uppercase tracking-wider">OP SKUs</p>
            <div class="flex items-center justify-between"><p class="text-xs text-muted flex items-center gap-2">Min ${pf.has("opShelfLifeMinPct") ? pendingBadge() : ""}</p>${inlineEdit("p_opMin", cfg.opShelfLifeMinPct, "prod-global:opShelfLifeMinPct", { suffix: "%" })}</div>
            <div class="flex items-center justify-between"><p class="text-xs text-muted flex items-center gap-2">Max ${pf.has("opShelfLifePct") ? pendingBadge() : ""}</p>${inlineEdit("p_opMax", cfg.opShelfLifePct, "prod-global:opShelfLifePct", { suffix: "%" })}</div>
          </div>
        </div>
      </div>
      <div class="bg-card border border-border rounded-xl p-5">
        <h3 class="text-sm font-semibold text-primary">Asset Class Eligibility</h3><p class="text-xs text-muted mt-1 mb-4">Global switches to enable or disable entire inventory classes from liquidation</p>
        <div class="space-y-3">
          ${eligRow("Standard SKUs", stdCount + " SKUs", "bg-row border border-border text-muted", "Regular active inventory eligible for liquidation. Individual SKU overrides are still respected.", "standardEnabled", cfg.standardEnabled)}
          ${eligRow("OP SKUs (Outdated Packaging)", opCount + " SKUs", "bg-amber-900/20 border border-amber-800/40 text-amber-400", "Inventory with outdated packaging. These are prioritised for liquidation when enabled.", "opEnabled", cfg.opEnabled)}
        </div>
      </div>
    </div>`;
  }

  function prBrands(effBrands, cfg) {
    const pIds = pendingBrandIds();
    const activeBrands = effBrands.filter((b) => b.isActive || pIds.has(b.id));
    const inactiveOpts = effBrands.filter((b) => !b.isActive && !pIds.has(b.id)).map((b) => ({ id: b.id, name: b.name }));
    const rows = activeBrands.map((b) => `<tr class="border-b border-border hover:bg-row/50 transition-colors">
      <td class="px-4 py-3"><p class="font-medium text-primary">${esc(b.name)}</p><p class="text-xs text-muted font-mono">${b.id}</p></td>
      <td class="px-4 py-3 text-sm text-muted font-mono">${b.categoryId}</td>
      <td class="px-4 py-3">${inlineEdit("pb_" + b.id, b.shelfLifeOverridePct, "prod-brand-sl:" + b.id, { suffix: "%", placeholder: `Global (${cfg.standardShelfLifePct}%)` })}</td>
      <td class="px-4 py-3"><div class="flex items-center gap-2">${toggle(b.isActive, "prod-brand-active:" + b.id, false)}<span class="text-xs bg-teal-900/30 text-teal-400 border border-teal-800/30 px-2 py-0.5 rounded-full">Brand Override</span>${pIds.has(b.id) ? pendingBadge() : ""}</div></td>
    </tr>`).join("");
    return `<div>
      ${csvPanel("Brand Overrides Bulk Upload", ["brand_id", "shelf_life_pct", "active"])}
      <div class="flex items-center justify-between gap-2 mb-4 flex-wrap"><span class="text-xs text-muted-dark whitespace-nowrap">${activeBrands.length} brand override${activeBrands.length === 1 ? "" : "s"}</span><button data-act="pr-brand-add-toggle" class="px-3 py-2 text-xs font-medium bg-accent/10 text-accent border border-accent/30 rounded-lg hover:bg-accent/20 transition-colors">${S.prBrandShowAdd ? "Cancel" : "+ Add override"}</button></div>
      ${S.prBrandShowAdd ? `<div class="bg-card border border-accent/30 rounded-xl p-4 mb-4 flex flex-wrap items-end gap-3"><div><p class="text-[10px] uppercase tracking-wider text-muted mb-1">Brand</p>${searchSelect("prBrandAdd", inactiveOpts, S.prBrandAdd, "pr-brand-add-pick", { placeholder: "Pick brand…", searchPlaceholder: "Search brand…" })}</div><button data-act="pr-brand-add-commit" ${!S.prBrandAdd ? "disabled" : ""} class="px-3 py-1.5 text-xs font-medium bg-accent text-white rounded-md hover:bg-accent-hover transition-colors disabled:opacity-40 disabled:cursor-not-allowed">Add override</button></div>` : ""}
      <div class="bg-card border border-border rounded-xl overflow-hidden"><table class="w-full text-sm"><thead><tr class="border-b border-border bg-row">${["Brand", "Category", "Shelf Life Override", "Status"].map((c) => `<th class="text-left text-xs font-medium text-muted uppercase tracking-wide px-4 py-3">${c}</th>`).join("")}</tr></thead><tbody>${rows || `<tr><td colspan="4" class="px-4 py-12 text-center text-muted text-sm">No brand overrides yet. Use + Add override or the bulk CSV upload to create one.</td></tr>`}</tbody></table></div>
    </div>`;
  }

  function prSkus(effSkus, effBrands, cfg) {
    const pIds = pendingSkuIds();
    const sourceOf = (s) => {
      if (s.shelfLifeOverridePct !== null) return "sku";
      const bo = effBrands.find((b) => b.id === s.brandId);
      if (bo?.isActive) return "brand";
      return "global";
    };
    const withOverride = effSkus.filter((s) => sourceOf(s) === "sku");
    const q = S.prSkuQ, ef = S.prSkuElig, tf = S.prSkuType;
    const filtered = withOverride.filter((s) => {
      if (q && ![s.name, s.id, s.brandName, s.categoryName].some((x) => x.toLowerCase().includes(q.toLowerCase()))) return false;
      if (ef === "eligible" && s.isIgnored) return false;
      if (ef === "ignored" && !s.isIgnored) return false;
      if (tf === "standard" && s.type !== "standard") return false;
      if (tf === "op" && s.type !== "op") return false;
      return true;
    });
    const globalOpts = effSkus.filter((s) => sourceOf(s) !== "sku").map((s) => ({ id: s.id, name: s.name }));
    const seg = (cur, opts, act) => `<div class="flex items-center rounded-lg border border-border overflow-hidden">${opts.map(([k, l]) => `<button data-act="${act}" data-val="${k}" class="px-3 py-2 text-xs font-medium transition-colors ${cur === k ? "bg-accent/10 text-accent" : "text-muted hover:text-primary"}">${l}</button>`).join("")}</div>`;
    const rows = filtered.map((s) => {
      const bo = effBrands.find((b) => b.id === s.brandId);
      const ph = (bo?.isActive && bo.shelfLifeOverridePct ? bo.shelfLifeOverridePct : cfg.standardShelfLifePct) + "%";
      return `<tr class="border-b border-border hover:bg-row/50 transition-colors">
        <td class="px-4 py-3 max-w-[280px]"><p class="font-medium text-primary">${esc(s.name)}</p><p class="text-xs text-muted font-mono">${s.id}</p></td>
        <td class="px-4 py-3"><p class="text-sm text-primary">${esc(s.brandName)}</p><p class="text-xs text-muted">${esc(s.categoryName)}</p></td>
        <td class="px-4 py-3">${s.type === "op" ? `<span class="text-xs bg-amber-900/30 text-amber-400 border border-amber-800/30 px-2 py-0.5 rounded-full">OP</span>` : `<span class="text-xs bg-blue-900/30 text-blue-400 border border-blue-800/30 px-2 py-0.5 rounded-full">Standard</span>`}</td>
        <td class="px-4 py-3">${inlineEdit("ps_" + s.id, s.shelfLifeOverridePct, "prod-sku-sl:" + s.id, { suffix: "%", placeholder: ph })}</td>
        <td class="px-4 py-3"><div class="flex items-center gap-1.5 flex-wrap"><span class="text-xs bg-violet-900/30 text-violet-400 border border-violet-800/30 px-2 py-0.5 rounded-full">SKU Override</span>${pIds.has(s.id) ? pendingBadge() : ""}</div></td>
        <td class="px-4 py-3 text-sm text-muted whitespace-nowrap">${nf(s.stockUnits)} u</td>
        <td class="px-4 py-3"><div class="flex items-center gap-2">${toggle(!s.isIgnored, "prod-sku-elig:" + s.id, false)}<span class="text-xs px-2 py-0.5 rounded-full ${!s.isIgnored ? "bg-green-900/30 text-green-400 border border-green-800/30" : "bg-red-900/30 text-red-400 border border-red-800/30"}">${s.isIgnored ? "Ignored" : "Eligible"}</span></div></td>
      </tr>`;
    }).join("");
    return `<div>
      ${csvPanel("SKU Configuration Bulk Upload", ["sku_id", "override_days", "ignored"])}
      <div class="flex flex-wrap items-center gap-2 mb-4">
        <div class="relative flex-1 min-w-[200px]"><span class="absolute left-3 top-1/2 -translate-y-1/2">${ICON.search}</span><input data-input="prSkuQ" value="${esc(q)}" placeholder="Search SKU, name, brand, category..." class="w-full bg-row border border-border rounded-lg pl-8 pr-3 py-2 text-sm text-primary placeholder:text-muted-dark focus:outline-none focus:border-accent transition-colors" /></div>
        ${seg(ef, [["all", "All"], ["eligible", "Eligible"], ["ignored", "Ignored"]], "prSkuElig")}
        ${seg(tf, [["all", "All Types"], ["standard", "Standard"], ["op", "OP"]], "prSkuType")}
        <button data-act="pr-sku-add-toggle" class="px-3 py-2 text-xs font-medium bg-accent/10 text-accent border border-accent/30 rounded-lg hover:bg-accent/20 transition-colors whitespace-nowrap">${S.prSkuShowAdd ? "Cancel" : "+ Add override"}</button>
        <span class="text-xs text-muted-dark whitespace-nowrap">${filtered.length} / ${withOverride.length} overridden SKUs</span>
      </div>
      ${S.prSkuShowAdd ? `<div class="bg-card border border-accent/30 rounded-xl p-4 mb-4 flex flex-wrap items-end gap-3"><div><p class="text-[10px] uppercase tracking-wider text-muted mb-1">SKU</p>${searchSelect("prSkuAdd", globalOpts, S.prSkuAdd, "pr-sku-add-pick", { placeholder: "Pick SKU…", searchPlaceholder: "Search SKU…" })}</div><button data-act="pr-sku-add-commit" ${!S.prSkuAdd ? "disabled" : ""} class="px-3 py-1.5 text-xs font-medium bg-accent text-white rounded-md hover:bg-accent-hover transition-colors disabled:opacity-40 disabled:cursor-not-allowed">Add override</button></div>` : ""}
      <div class="bg-card border border-border rounded-xl overflow-hidden"><table class="w-full text-sm"><thead><tr class="border-b border-border bg-row">${["SKU", "Brand / Category", "Type", "Shelf Life", "Source", "Stock", "Eligibility"].map((c) => `<th class="text-left text-xs font-medium text-muted uppercase tracking-wide px-4 py-3">${c}</th>`).join("")}</tr></thead><tbody>${rows || `<tr><td colspan="7" class="px-4 py-12 text-center text-muted text-sm">${withOverride.length === 0 ? "No SKU overrides yet. Use + Add override or the bulk CSV upload above." : "No SKUs match the current filters."}</td></tr>`}</tbody></table></div>
    </div>`;
  }

  const CONDITION_META = {
    good:    { label: "Good",    description: "Saleable inventory in full sellable condition.", icon: `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>`, dot: "bg-green-400" },
    damaged: { label: "Damaged", description: "Inventory with packaging or product damage — still movable.", icon: `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>`, dot: "bg-amber-400" },
    expired: { label: "Expired", description: "Past expiry date. Requires special handling / disposal.", icon: `<svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>`, dot: "bg-red-400" },
  };

  function prConditions() {
    const pIds = pendingCondIds();
    const conds = inventoryConditions.map(effCondition);
    const enabledCount = conds.filter((c) => c.isEnabled).length;
    const cards = conds.map((c) => {
      const m = CONDITION_META[c.conditionType];
      return `<div class="bg-card border border-border rounded-xl p-5 flex items-center gap-4">
        <div class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0 ${c.isEnabled ? "bg-accent/15 text-accent" : "bg-row text-muted"}">${m.icon}</div>
        <div class="flex-1 min-w-0"><div class="flex items-center gap-2 mb-0.5"><span class="text-sm font-semibold text-primary">${m.label}</span>${!c.isEnabled ? `<span class="text-xs font-medium bg-red-900/30 text-red-400 border border-red-800/30 px-2 py-0.5 rounded-md">Out of Scope</span>` : ""}</div><p class="text-sm text-muted">${m.description}</p></div>
        <div class="flex items-center gap-2 shrink-0">${pIds.has(c.conditionType) ? pendingBadge() : ""}<span class="text-xs font-medium ${c.isEnabled ? "text-green-400" : "text-muted"}">${c.isEnabled ? "Enabled" : "Disabled"}</span>${toggle(c.isEnabled, "prod-cond:" + c.conditionType, false)}</div>
      </div>`;
    }).join("");
    const dots = conds.map((c) => { const m = CONDITION_META[c.conditionType]; return `<div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full ${c.isEnabled ? m.dot : "bg-[#2d3748]"}"></span><span class="text-xs ${c.isEnabled ? "text-primary" : "text-muted"}">${m.label}</span></div>`; }).join("");
    return `<div class="space-y-4">
      <div class="bg-card border border-border rounded-xl p-4 flex gap-3 border-l-2 border-l-accent"><svg class="w-4 h-4 text-accent mt-0.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8v4m0 4h.01"/></svg><p class="text-sm text-muted"><span class="text-accent font-semibold">Inventory Condition Rules</span> define which physical states of inventory are planned for movement in this liquidation run. Enable a condition, then select the allowed disposition methods for it.</p></div>
      <div class="space-y-3">${cards}</div>
      <div class="bg-card border border-border rounded-xl flex items-stretch overflow-hidden"><div class="px-5 py-3 flex items-center"><span class="text-sm text-muted"><span class="text-primary font-semibold">${enabledCount}</span> of 3 conditions in scope for this run</span></div><div class="w-px bg-border"></div><div class="px-5 py-3 flex items-center gap-4">${dots}</div></div>
    </div>`;
  }
  </script>
  <script id="approval">
  /* ═══════════════════════ APPROVAL PAGE ═══════════════════════ */
  function orderTypeBadge(t) {
    if (t === "wh_transfer") return `<span class="text-xs bg-blue-900/30 text-blue-400 border border-blue-800/30 px-2 py-0.5 rounded-full">WH Transfer</span>`;
    if (t === "b2b") return `<span class="text-xs bg-violet-900/30 text-violet-400 border border-violet-800/30 px-2 py-0.5 rounded-full">B2B Order</span>`;
    return `<span class="text-xs bg-orange-900/30 text-orange-400 border border-orange-800/30 px-2 py-0.5 rounded-full">Liq. Stock</span>`;
  }
  function statusBadge(s) {
    if (s === "pending") return `<span class="text-xs bg-amber-900/30 text-amber-400 border border-amber-700/30 px-2 py-0.5 rounded-full">Pending</span>`;
    if (s === "in_transit") return `<span class="text-xs bg-blue-900/30 text-blue-400 border border-blue-800/30 px-2 py-0.5 rounded-full">In Transit</span>`;
    return `<span class="text-xs bg-row text-muted border border-border px-2 py-0.5 rounded-full">Cancelled</span>`;
  }

  function pageApproval() {
    const tabs = ["Pending Approval", "Manage Transactions"];
    const tabbar = `<div class="flex items-center gap-1 border-b border-border mb-6">${tabs.map((t) => `<button data-act="apTab" data-val="${esc(t)}" class="px-4 py-2.5 text-sm font-medium transition-colors border-b-2 -mb-px ${S.apTab === t ? "border-accent text-accent" : "border-transparent text-muted hover:text-primary"}">${t}</button>`).join("")}</div>`;
    const body = S.apTab === "Pending Approval" ? apPending() : apManage();
    return `<div class="p-8"><div class="mb-6"><h1 class="text-2xl font-semibold text-primary">Transfer Approval</h1><p class="text-muted text-sm mt-1">Review engine-generated batches · Authorize or reject · Manage in-flight orders</p></div>${tabbar}${body}</div>`;
  }

  function apPending() {
    const batch = batches.find((b) => b.status === "pending_approval");
    if (!batch || S.apReject) return `<div class="rounded-xl border border-dashed border-border p-12 text-center"><p class="text-muted">No batches pending approval.</p></div>`;
    const bOrders = orders.filter((o) => o.batchId === batch.id);
    const bLines = lineItems.filter((li) => bOrders.some((o) => o.id === li.orderId));
    const totalOrders = bOrders.length;
    const totalSkus = new Set(bLines.map((li) => li.skuId)).size;
    const totalUnits = bLines.reduce((s, li) => s + li.units, 0);
    const totalCogs = bOrders.reduce((s, o) => s + o.cogs, 0);
    const totalWeight = bOrders.reduce((s, o) => s + o.weight, 0);
    const stats = [
      { label: "Total Orders", value: totalOrders },
      { label: "Total SKUs", value: totalSkus },
      { label: "Total Units", value: totalUnits },
      { label: "Total COGS", value: `₹${(totalCogs / 1000).toFixed(0)}K` },
      { label: "Total Weight", value: `${totalWeight} kg` },
    ].map((s) => `<div class="bg-row rounded-lg p-3 text-center"><p class="text-xs text-muted uppercase tracking-wide">${s.label}</p><p class="text-base font-semibold text-primary mt-1">${s.value}</p></div>`).join("");
    const isVerified = S.apAuth === batch.id;

    const orderCards = bOrders.map((order) => {
      const expanded = !!S.apExpanded[order.id];
      const lines = lineItems.filter((li) => li.orderId === order.id);
      let table = "";
      if (expanded) {
        const rows = lines.map((li) => {
          const ed = li.expiryDate ? new Date(li.expiryDate) : null;
          const isExpired = ed !== null && ed < new Date("2024-08-01");
          let expiryCell;
          if (ed === null) expiryCell = `<span class="text-muted">No expiry</span>`;
          else if (isExpired) expiryCell = `<span class="text-red-400 flex items-center gap-1"><svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>${fmtDate(li.expiryDate)}</span>`;
          else expiryCell = `<span class="text-primary">${fmtDate(li.expiryDate)}</span>`;
          return `<tr class="border-b border-border/50"><td class="py-2 pr-4 font-mono text-muted">${li.skuId}</td><td class="py-2 pr-4 text-primary">${esc(li.skuName)}</td><td class="py-2 pr-4 text-primary">${li.units}</td><td class="py-2 pr-4 text-primary">₹${nf(li.cogs)}</td><td class="py-2 pr-4">${expiryCell}</td></tr>`;
        }).join("");
        table = `<div class="bg-row border-t border-border p-4"><table class="w-full text-xs"><thead><tr class="border-b border-border">${["SKU ID", "Name", "Units", "COGS (₹)", "Expiry"].map((c) => `<th class="text-left text-muted font-medium pb-2 pr-4">${c}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
      }
      return `<div class="bg-card border border-border rounded-xl mb-2 overflow-hidden">
        <div class="flex items-center gap-3 p-4 cursor-pointer" data-act="ap-expand" data-id="${order.id}">
          <span class="w-2 h-2 rounded-full bg-amber-400 flex-shrink-0"></span>
          <span class="text-sm font-mono font-medium text-primary">${order.id}</span>${orderTypeBadge(order.type)}
          <span class="text-xs text-muted">${esc(order.sourceName)} → ${esc(order.destinationName)}</span>
          <span class="flex-1"></span>
          <span class="text-xs text-muted gap-3 flex items-center"><span>${order.units} units</span><span>₹${(order.cogs / 1000).toFixed(1)}K</span><span>${order.weight} kg</span></span>
          <svg class="w-4 h-4 text-muted transition-transform ${expanded ? "rotate-90" : ""}" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </div>${table}</div>`;
    }).join("");

    let authGate;
    if (S.apCommitted) {
      authGate = `<div class="text-center"><div class="w-12 h-12 rounded-full bg-green-900/30 border border-green-800/30 flex items-center justify-center mx-auto mb-3"><svg class="w-6 h-6 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg></div><p class="text-primary font-semibold mb-3">Batch Committed</p><div class="flex flex-col gap-1">${bOrders.map((o) => `<p class="text-xs font-mono text-muted">${o.id}</p>`).join("")}</div></div>`;
    } else {
      authGate = `<p class="text-base font-semibold text-primary flex items-center gap-2">🔑 Authorization Gate</p>
        <p class="text-sm text-muted mt-1 mb-4">Enter the Liquidation Identifier to authorize this batch.</p>
        <input data-input="apAuth" value="${esc(S.apAuth)}" type="text" placeholder="e.g. LIQ-2024-0047" class="w-full bg-row border border-border rounded-lg px-3 py-2 text-sm font-mono text-primary focus:outline-none focus:border-accent" />
        ${S.apAuth !== "" ? `<p class="mt-2 text-xs ${isVerified ? "text-green-400" : "text-red-400"}">${isVerified ? "✓ Batch ID verified" : "✗ ID does not match pending batch"}</p>` : ""}
        <button data-act="ap-authorize" ${!isVerified ? "disabled" : ""} class="mt-4 w-full bg-accent text-white rounded-lg py-2 text-sm font-medium transition-opacity ${!isVerified ? "opacity-40 cursor-not-allowed" : "hover:opacity-90"}">Authorize Batch</button>
        <button data-act="ap-reject" class="mt-2 w-full border border-border text-red-400 hover:border-red-700 rounded-lg py-2 text-sm transition-colors">Reject Batch</button>
        <div class="mt-4 bg-amber-900/10 border border-amber-800/20 rounded-lg p-3 text-xs text-amber-400/80">Committing will mark all transfer orders as active.</div>`;
    }

    return `<div>
      <div class="flex items-center gap-3 bg-amber-900/20 border border-amber-700/30 rounded-xl p-3 mb-4"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 flex-shrink-0"></span><span class="text-sm text-amber-300 font-medium">Test Mode — Engine Simulation</span><span class="ml-auto text-xs border border-amber-600/50 text-amber-400 px-2 py-0.5 rounded-full">TEST</span></div>
      <div class="bg-card border border-border rounded-xl p-5 mb-4"><div class="flex items-center gap-3 mb-2"><span class="font-mono text-xl font-bold text-primary">${batch.id}</span><span class="text-xs bg-amber-900/30 text-amber-400 border border-amber-700/30 px-2 py-0.5 rounded-full">Awaiting Approval</span></div><p class="text-xs text-muted">Generated ${fmtDate(batch.generatedAt)} &middot; Sink: ${esc(batch.masterSinkName)}</p></div>
      <div class="grid grid-cols-5 gap-2 mb-4">${stats}</div>
      <div class="flex gap-4"><div class="flex-1">${orderCards}</div><div class="w-72 sticky top-8 self-start"><div class="bg-card border border-border rounded-xl p-5">${authGate}</div></div></div>
    </div>`;
  }

  function apManage() {
    const q = S.txnSearch, f = S.txnStatus;
    const filtered = orders.filter((o) => {
      if (q && !o.id.toLowerCase().includes(q.toLowerCase()) && !o.batchId.toLowerCase().includes(q.toLowerCase())) return false;
      if (f !== "all" && o.status !== f) return false;
      return true;
    });
    const pendingCount = orders.filter((o) => o.status === "pending").length;
    const inTransit = orders.filter((o) => o.status === "in_transit").length;
    const pillBase = "text-xs px-3 py-1.5 rounded-full border cursor-pointer transition-colors select-none";
    const pillA = "bg-accent/20 border-accent/40 text-accent";
    const pillI = "bg-row border-border text-muted hover:text-primary";
    const filters = [["all", "All"], ["pending", "Pending"], ["in_transit", "In Transit"], ["cancelled", "Cancelled"]];
    const rows = filtered.map((o) => {
      let action;
      if (o.status === "pending") action = `<button data-act="txn-cancel" data-id="${o.id}" class="text-red-400 hover:text-red-300 transition-colors text-lg leading-none" title="Cancel">×</button>`;
      else if (o.status === "in_transit") action = `<svg class="w-4 h-4 text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>`;
      else action = `<span class="text-muted">—</span>`;
      return `<tr class="border-b border-border hover:bg-row/50 transition-colors"><td class="px-4 py-3 font-mono text-xs text-primary">${o.id}</td><td class="px-4 py-3 font-mono text-xs text-muted">${o.batchId}</td><td class="px-4 py-3">${orderTypeBadge(o.type)}</td><td class="px-4 py-3 text-xs text-muted">${esc(o.sourceName)} → ${esc(o.destinationName)}</td><td class="px-4 py-3 text-xs text-muted">${o.units} SKUs · ${o.units} units · ₹${(o.cogs / 1000).toFixed(1)}K</td><td class="px-4 py-3">${statusBadge(o.status)}</td><td class="px-4 py-3">${action}</td></tr>`;
    }).join("");
    return `<div>
      <div class="grid grid-cols-2 gap-4 mb-6">
        <div class="bg-card border border-border rounded-xl p-4"><p class="text-sm font-medium text-primary mb-3">Cancel by Batch ID</p><input data-input="txnBatchId" value="${esc(S.txnBatchId || "")}" type="text" placeholder="e.g. BATCH-2024-001" class="bg-row border border-border rounded-lg px-3 py-2 text-sm font-mono text-primary w-full mb-2 focus:outline-none focus:border-accent" /><button data-act="txn-cancel-batch" ${!S.txnBatchId ? "disabled" : ""} class="bg-red-900/30 border border-red-800/30 text-red-400 text-sm rounded-lg py-1.5 px-3 hover:bg-red-900/50 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">Cancel All</button></div>
        <div class="bg-card border border-border rounded-xl p-4"><p class="text-sm font-medium text-primary mb-3">Cancel by Source Warehouse</p><input data-input="txnBulkBatch" value="${esc(S.txnBulkBatch || "")}" type="text" placeholder="Batch ID (optional)" class="bg-row border border-border rounded-lg px-3 py-2 text-sm font-mono text-primary w-full mb-2 focus:outline-none focus:border-accent" /><p class="text-xs text-muted mb-2">Batch ID is optional</p><input data-input="txnSource" value="${esc(S.txnSource || "")}" type="text" placeholder="Source warehouse name" class="bg-row border border-border rounded-lg px-3 py-2 text-sm text-primary w-full mb-2 focus:outline-none focus:border-accent" /><button data-act="txn-cancel-source" ${!S.txnSource ? "disabled" : ""} class="bg-red-900/30 border border-red-800/30 text-red-400 text-sm rounded-lg py-1.5 px-3 hover:bg-red-900/50 transition-colors disabled:opacity-40 disabled:cursor-not-allowed">Cancel All</button></div>
      </div>
      <div class="flex flex-wrap items-center gap-3 mb-4">
        <input data-input="txnSearch" value="${esc(q)}" type="text" placeholder="Search by TXN ID or Batch…" class="text-sm bg-row border border-border rounded-lg px-3 py-2 text-primary placeholder-muted focus:outline-none focus:border-accent w-56" />
        <div class="flex items-center gap-1">${filters.map(([k, l]) => `<button data-act="txnStatus" data-val="${k}" class="${pillBase} ${f === k ? pillA : pillI}">${l}</button>`).join("")}</div>
        <div class="ml-auto flex items-center gap-2"><span class="text-xs bg-amber-900/20 text-amber-400 border border-amber-700/30 px-2 py-0.5 rounded-full">${pendingCount} pending</span><span class="text-xs bg-blue-900/20 text-blue-400 border border-blue-800/30 px-2 py-0.5 rounded-full">${inTransit} in transit</span></div>
      </div>
      <div class="bg-card border border-border rounded-xl overflow-hidden"><table class="w-full text-sm"><thead><tr class="border-b border-border bg-row">${["TXN ID", "Batch ID", "Type", "Source → Dest", "SKUs / Units / COGS", "Status", "Action"].map((c) => `<th class="text-left text-xs font-medium text-muted uppercase tracking-wide px-4 py-3">${c}</th>`).join("")}</tr></thead><tbody>${rows || `<tr><td colspan="7" class="px-4 py-12 text-center text-muted text-sm">No transactions match the current filters.</td></tr>`}</tbody></table></div>
    </div>`;
  }
  </script>
  <script id="audit">
  /* ═══════════════════════ AUDIT PAGE ═══════════════════════ */
  const MODULE_LABELS = { warehouse_setup: "Warehouse Setup", product_config: "Product Config", transfer_thresholds: "Transfer Thresholds", transfer_approval: "Transfer Approval", draft: "Draft" };
  function moduleBadge(m) {
    const map = {
      warehouse_setup: "bg-teal-900/30 text-teal-400 border-teal-800/30",
      product_config: "bg-violet-900/30 text-violet-400 border-violet-800/30",
      transfer_thresholds: "bg-cyan-900/30 text-cyan-400 border-cyan-800/30",
      transfer_approval: "bg-orange-900/30 text-orange-400 border-orange-800/30",
      draft: "bg-green-900/30 text-green-400 border-green-800/30",
    };
    const cls = map[m] ?? "bg-row text-muted border-border";
    return `<span class="text-xs px-2 py-0.5 rounded-full border font-medium ${cls}">${MODULE_LABELS[m] ?? m}</span>`;
  }
  function committedActionDisplay(action, afterJson) {
    let after = {}; try { after = JSON.parse(afterJson || "{}"); } catch (e) {}
    const M = {
      configuration_committed: { label: "Committed", color: "text-green-400", dot: "bg-green-400 shadow-[0_0_6px_2px_rgba(74,222,128,0.5)]" },
      master_sink_updated: { label: "Sink Updated", color: "text-teal-400", dot: "bg-teal-400" },
      master_sink_cleared: { label: "Sink Cleared", color: "text-muted", dot: "bg-border" },
      route_pair_override_set: { label: "Route Override", color: "text-teal-400", dot: "bg-teal-400" },
      route_pair_override_cleared: { label: "Route Cleared", color: "text-muted", dot: "bg-border" },
      global_threshold_updated: { label: "Global Updated", color: "text-amber-400", dot: "bg-amber-400" },
      category_threshold_updated: { label: "Category Override", color: "text-amber-400", dot: "bg-amber-400" },
      category_threshold_cleared: { label: "Threshold Cleared", color: "text-muted", dot: "bg-border" },
      brand_threshold_updated: { label: "Brand Override", color: "text-blue-400", dot: "bg-blue-400" },
      brand_threshold_cleared: { label: "Threshold Cleared", color: "text-muted", dot: "bg-border" },
      product_config_updated: { label: "Config Updated", color: "text-violet-400", dot: "bg-violet-400" },
      brand_shelf_life_updated: { label: "Brand Override", color: "text-blue-400", dot: "bg-blue-400" },
      sku_ignored: { label: "SKU Ignored", color: "text-red-400", dot: "bg-red-400" },
      sku_unignored: { label: "SKU Unignored", color: "text-green-400", dot: "bg-green-400" },
      sku_shelf_life_override_set: { label: "SKU Override", color: "text-violet-400", dot: "bg-violet-400" },
      inventory_condition_updated: { label: "Condition Updated", color: "text-teal-400", dot: "bg-teal-400" },
      batch_reviewed: { label: "Batch Reviewed", color: "text-orange-400", dot: "bg-orange-400" },
    };
    if (action === "donor_participation_updated") return after.isParticipating === false ? { label: "Donor Disabled", color: "text-red-400", dot: "bg-red-400" } : { label: "Donor Enabled", color: "text-teal-400", dot: "bg-teal-400" };
    return M[action] ?? { label: action.replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase()), color: "text-muted", dot: "bg-border" };
  }
  function pendingActionDisplay(c) {
    switch (c.entity) {
      case "donor_participation": return c.payload.isParticipating === false ? { label: "Donor Disabled", color: "text-red-400", dot: "bg-red-400" } : { label: "Donor Enabled", color: "text-teal-400", dot: "bg-teal-400" };
      case "master_sink": return c.op === "set" ? { label: "Sink Updated", color: "text-teal-400", dot: "bg-teal-400" } : { label: "Sink Cleared", color: "text-muted", dot: "bg-border" };
      case "pair_override": return c.op === "set" ? { label: "Route Override", color: "text-teal-400", dot: "bg-teal-400" } : { label: "Route Cleared", color: "text-muted", dot: "bg-border" };
      case "global_threshold": return { label: "Global Updated", color: "text-amber-400", dot: "bg-amber-400" };
      case "category_threshold": return { label: "Category Override", color: "text-amber-400", dot: "bg-amber-400" };
      case "category_threshold_clear": return { label: "Threshold Cleared", color: "text-muted", dot: "bg-border" };
      case "brand_threshold": return { label: "Brand Override", color: "text-blue-400", dot: "bg-blue-400" };
      case "brand_threshold_clear": return { label: "Threshold Cleared", color: "text-muted", dot: "bg-border" };
      case "global_product_config": return { label: "Config Updated", color: "text-violet-400", dot: "bg-violet-400" };
      case "brand_shelf_life": return { label: "Brand Override", color: "text-blue-400", dot: "bg-blue-400" };

  <script id="wireup">

  let _aud = 100;

  const AUDIT_MODULE = { donor_participation: "warehouse_setup", master_sink: "warehouse_setup", pair_override: "warehouse_setup", global_threshold: "transfer_thresholds", category_threshold: "transfer_thresholds", category_threshold_clear: "transfer_thresholds", brand_threshold: "transfer_thresholds", brand_threshold_clear: "transfer_thresholds", global_product_config: "product_config", brand_shelf_life: "product_config", sku_config: "product_config", inventory_condition: "product_config" };

      case "donor_participation": { const d = donorSettings.find((x) => x.warehouseId === c.targetId); if (d) d.isParticipating = p.isParticipating; break; }
      case "pair_override": { let o = overrides.find((x) => x.donorWarehouseId === c.targetId); if (c.op === "set") { if (o) { o.sinkWarehouseId = p.sinkId; o.isActive = true; } else overrides.push({ donorWarehouseId: c.targetId, sinkWarehouseId: p.sinkId, isActive: true }); } else if (o) o.isActive = false; break; }
      case "global_threshold": thresholdsGlobal[p.field] = p.value; break;
